[workspace]
members = [
    "crates/poise-core",
    "crates/poise-discovery",
    "crates/poise-health",
    "crates/poise-observe",
    "crates/poise-tokio",
    "crates/poise-tower",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/copyleftdev/poise-rs"
homepage = "https://copyleftdev.github.io/poise-rs/"

[workspace.dependencies]
poise-core = { version = "0.1.0", path = "crates/poise-core" }
poise-discovery = { version = "0.1.0", path = "crates/poise-discovery" }
poise-health = { version = "0.1.0", path = "crates/poise-health" }
poise-observe = { version = "0.1.0", path = "crates/poise-observe" }
poise-tokio = { version = "0.1.0", path = "crates/poise-tokio" }
poise-tower = { version = "0.1.0", path = "crates/poise-tower" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
