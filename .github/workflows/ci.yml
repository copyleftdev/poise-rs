name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Format, lint, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Pinned rather than inherited: the scripts use `import.meta.dirname`,
      # which needs Node 20.11 or newer, and a runner image changing under us
      # should not be how we find that out.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node scripts/check-release-metadata.mjs
      # Counted claims in the prose, checked against the tree they describe.
      # Several have shipped past their expiry already, and each read correctly
      # while being wrong.
      - run: node scripts/check-docs-drift.mjs
      # The script suite decides what blocks a merge, so its own arithmetic is
      # tested rather than trusted.
      - name: Script unit tests
        run: node --test scripts/*.test.mjs

  book:
    name: Documentation book
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: mdbook-0.5.2
      - name: Install pinned mdBook
        run: cargo install mdbook --version 0.5.2 --locked
      - run: scripts/build-book.sh

  test:
    name: Test / Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, 1.85.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo test --locked --workspace --all-features

  properties:
    name: Deterministic property laws
    runs-on: ubuntu-latest
    env:
      PROPTEST_RNG_SEED: "1592614637"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Selection laws
        run: cargo test --locked -p poise-core --test property_selection
      - name: Affinity laws
        run: cargo test --locked -p poise-core --test property_affinity
      - name: Topology laws
        run: cargo test --locked -p poise-core --test property_topology
      # Ignored by default and run here in release. The samples run to millions,
      # which costs tens of milliseconds optimized and about three seconds
      # unoptimized -- and the mutation campaign runs the unoptimized suite once
      # per mutant, where three seconds becomes half an hour.
      - name: Distribution sensitivity
        run: >-
          cargo test --locked --release -p poise-core
          --test distribution_power -- --ignored

  loom:
    name: Exhaustive scheduler models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: scripts/model-check.sh

  package:
    name: Package archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: scripts/package-workspace.sh --root-only
