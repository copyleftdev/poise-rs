name: Verify and publish showcase

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      book_outcome: ${{ steps.book.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job builds the book and writes the showcase record, both of which
      # run Node scripts. Without this step they ran on whatever Node the runner
      # image happened to ship, which is a toolchain nobody chose and one image
      # update away from failing the publish for a reason nobody changed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install declared compiler floor
        run: rustup toolchain install 1.85.0 --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Ordinary workspace suite
        id: ordinary
        continue-on-error: true
        run: cargo test --workspace --all-features

      - name: Generated property laws
        id: property
        continue-on-error: true
        env:
          PROPTEST_RNG_SEED: "1592614637"
        run: |
          cargo test -p poise-core --test property_selection
          cargo test -p poise-core --test property_affinity
          cargo test -p poise-core --test property_topology

      - name: Exhaustive Loom scheduler models
        id: loom
        continue-on-error: true
        run: scripts/model-check.sh

      - name: Rust 1.85 compiler floor
        id: msrv
        continue-on-error: true
        run: rustup run 1.85.0 cargo test --workspace --all-features

      - name: Install pinned mutation runner
        run: cargo install cargo-mutants --version 27.0.0 --locked

      # The campaign takes about forty minutes on a hosted runner and grew into
      # its own step timeout: run 31847817773 caught every terminating mutant
      # and was killed in the same second it said so, publishing a failure for a
      # gate that had passed. The wrapper's own deadline is set below the step's
      # so an overrun is reported as an overrun, with the limit named, rather
      # than as an opaque cancellation.
      - name: Complete mutation gate
        id: mutation
        continue-on-error: true
        timeout-minutes: 75
        env:
          POISE_MUTANTS_TIMEOUT: "4200"
        run: scripts/mutants-core.sh

      - name: Install pinned mdBook
        run: cargo install mdbook --version 0.5.2 --locked

      - name: Build engineering book
        id: book
        run: scripts/build-book.sh

      - name: Export honest showcase record
        if: always()
        env:
          POISE_ORDINARY_OUTCOME: ${{ steps.ordinary.outcome }}
          POISE_PROPERTY_OUTCOME: ${{ steps.property.outcome }}
          POISE_LOOM_OUTCOME: ${{ steps.loom.outcome }}
          POISE_MSRV_OUTCOME: ${{ steps.msrv.outcome }}
          POISE_MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
        run: node scripts/write-showcase-data.mjs

      - name: Configure Pages
        if: always() && steps.book.outcome == 'success'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload showcase
        if: always() && steps.book.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Preserve verification gate result
        if: always()
        env:
          ORDINARY: ${{ steps.ordinary.outcome }}
          PROPERTY: ${{ steps.property.outcome }}
          LOOM: ${{ steps.loom.outcome }}
          MSRV: ${{ steps.msrv.outcome }}
          MUTATION: ${{ steps.mutation.outcome }}
        run: |
          test "$ORDINARY" = success
          test "$PROPERTY" = success
          test "$LOOM" = success
          test "$MSRV" = success
          test "$MUTATION" = success

  deploy:
    if: always() && needs.verify.outputs.book_outcome == 'success'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish passing or failing evidence
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
