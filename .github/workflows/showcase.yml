name: Verify and publish showcase

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install declared compiler floor
        run: rustup toolchain install 1.85.0 --profile minimal

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Ordinary workspace suite
        id: ordinary
        continue-on-error: true
        run: cargo test --workspace --all-features

      - name: Generated property laws
        id: property
        continue-on-error: true
        env:
          PROPTEST_RNG_SEED: "1592614637"
        run: |
          cargo test -p poise-core --test property_selection
          cargo test -p poise-core --test property_affinity
          cargo test -p poise-core --test property_topology

      - name: Exhaustive Loom scheduler models
        id: loom
        continue-on-error: true
        run: scripts/model-check.sh

      - name: Rust 1.85 compiler floor
        id: msrv
        continue-on-error: true
        run: rustup run 1.85.0 cargo test --workspace --all-features

      - name: Install pinned mutation runner
        run: cargo install cargo-mutants --version 27.0.0 --locked

      - name: Complete mutation gate
        id: mutation
        continue-on-error: true
        timeout-minutes: 40
        run: scripts/mutants-core.sh --jobs 1

      - name: Export honest showcase record
        if: always()
        env:
          POISE_ORDINARY_OUTCOME: ${{ steps.ordinary.outcome }}
          POISE_PROPERTY_OUTCOME: ${{ steps.property.outcome }}
          POISE_LOOM_OUTCOME: ${{ steps.loom.outcome }}
          POISE_MSRV_OUTCOME: ${{ steps.msrv.outcome }}
          POISE_MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
        run: node scripts/write-showcase-data.mjs

      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload showcase
        if: always()
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Preserve verification gate result
        if: always()
        env:
          ORDINARY: ${{ steps.ordinary.outcome }}
          PROPERTY: ${{ steps.property.outcome }}
          LOOM: ${{ steps.loom.outcome }}
          MSRV: ${{ steps.msrv.outcome }}
          MUTATION: ${{ steps.mutation.outcome }}
        run: |
          test "$ORDINARY" = success
          test "$PROPERTY" = success
          test "$LOOM" = success
          test "$MSRV" = success
          test "$MUTATION" = success

  deploy:
    if: always()
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish passing or failing evidence
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
