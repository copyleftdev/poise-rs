name: Bootstrap crates.io publication

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-poise-0.1.0 after reviewing docs/releasing.md
        required: true
        type: string

concurrency:
  group: bootstrap-crates-io
  cancel-in-progress: false

jobs:
  publish-first-versions:
    name: First dependency-ordered publication
    if: inputs.confirmation == 'publish-poise-0.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io-bootstrap
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Re-run release gates
        run: |
          node scripts/check-release-metadata.mjs --publishable
          cargo test --locked --workspace --all-features
          scripts/package-workspace.sh --root-only
      - name: Publish first versions with a scoped bootstrap token
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
