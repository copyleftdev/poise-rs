name: Bootstrap crates.io publication (retired)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type acknowledge-bootstrap-complete
        required: true
        type: string

jobs:
  bootstrap-complete:
    name: Bootstrap is complete
    if: inputs.confirmation == 'acknowledge-bootstrap-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Explain the retired workflow
        run: |
          echo 'The six Poise crate names were claimed with version 0.1.0 on 2026-08-05.'
          echo 'Use the protected Release workflow for every subsequent version.'
