[workspace]
allow_dirty = false
changelog_update = true
dependencies_update = false
git_release_enable = true
git_release_type = "auto"
publish = true
publish_allow_dirty = false
publish_no_verify = false
publish_timeout = "10m"
release_always = false
semver_check = true
pr_labels = ["release"]
pr_name = "chore: release Poise"

[[package]]
name = "poise-core"
version_group = "poise"
changelog_path = "CHANGELOG.md"

[[package]]
name = "poise-discovery"
version_group = "poise"
changelog_path = "CHANGELOG.md"

[[package]]
name = "poise-health"
version_group = "poise"
changelog_path = "CHANGELOG.md"

[[package]]
name = "poise-tower"
version_group = "poise"
changelog_path = "CHANGELOG.md"

[[package]]
name = "poise-tokio"
version_group = "poise"
changelog_path = "CHANGELOG.md"

[[package]]
name = "poise-observe"
version_group = "poise"
changelog_path = "CHANGELOG.md"

[changelog]
protect_breaking_commits = true
sort_commits = "oldest"
